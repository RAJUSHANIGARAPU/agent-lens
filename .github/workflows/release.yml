name: Release

# Publishes to PyPI when a version tag is pushed:
#
#     git tag -a v0.3.0 -m "0.3.0" && git push origin v0.3.0
#
# Authentication is PyPI Trusted Publishing (OIDC). There is deliberately no API
# token anywhere in this repo: GitHub mints a short-lived credential for this
# workflow, PyPI verifies it came from this repo/workflow/environment, and
# nothing long-lived exists to leak, rotate, or accidentally commit.
#
# One-time setup on PyPI, at
# https://pypi.org/manage/project/agentlens-tracer/settings/publishing/ — the
# four values must match this file exactly:
#
#     Owner:              RAJUSHANIGARAPU
#     Repository name:    agent-lens
#     Workflow name:      release.yml
#     Environment name:   pypi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  # A tag is not a promise that the code is good — re-run the suite against the
  # exact commit being published rather than trusting that CI passed on a branch.
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies with vendor SDKs
        run: pip install -e ".[dev,sdks]"

      - name: Lint
        run: ruff check agent_lens/ tests/

      # The vendors are installed here, so a skipped surface check means the
      # check did not run — do not publish on the strength of a run that
      # verified nothing.
      - name: Test, including the vendor surface checks
        env:
          AGENT_LENS_REQUIRE_SDKS: "1"
        run: pytest tests/ -q

  build:
    name: Build distribution
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: pip install build twine

      - name: Build
        run: python -m build

      # A tag of v1.2.3 must not ship a package built from version 1.2.2. Without
      # this the mismatch is only visible after it is on PyPI and unfixable.
      - name: Check the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built="$(ls dist/*.tar.gz | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')"
          echo "tag=$tag packaged=$built"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match packaged version $built"
            exit 1
          fi

      - name: Validate metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Named environment is half of what PyPI verifies in the OIDC claim; it also
    # gives you a place to add a manual approval gate later if you want one.
    environment:
      name: ${{ github.event.inputs.target || 'pypi' }}
      url: https://pypi.org/project/agentlens-tracer/
    permissions:
      id-token: write # mint the OIDC token; this is the whole credential story
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        if: github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: github.event.inputs.target != 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
