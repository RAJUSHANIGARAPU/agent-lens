name: Generate Demo GIF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - demo.tape
      - examples/07_demo_mock.py
  pull_request:
    branches: [main]
    paths:
      - demo.tape
      - examples/07_demo_mock.py
      - .github/workflows/demo.yml

permissions:
  contents: read

jobs:
  generate:
    name: Render demo.gif with VHS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg ttyd

      - name: Install agent-lens
        run: pip install -e ".[dev]"

      - name: Render demo.gif
        uses: charmbracelet/vhs-action@v2
        with:
          path: demo.tape
          version: "v0.12.1"
          install-dependencies: false

      - name: Extract preview frames
        run: |
          ffmpeg -y -loglevel error -i demo.gif -vf "select=gte(t\,4)" -frames:v 1 demo-frame-early.png
          ffmpeg -y -loglevel error -i demo.gif -update 1 demo-frame-last.png

      - name: Upload demo.gif
        uses: actions/upload-artifact@v4
        with:
          name: demo-gif
          path: demo.gif
          if-no-files-found: error

      - name: Upload preview frames
        uses: actions/upload-artifact@v4
        with:
          name: demo-frames
          path: demo-frame-*.png
          if-no-files-found: error
