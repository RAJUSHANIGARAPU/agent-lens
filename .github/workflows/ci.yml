name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check agent_lens/ tests/ --output-format=github

      - name: Run tests with coverage
        shell: bash
        run: |
          pytest tests/ \
            --cov=agent_lens \
            --cov-report=xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  sdk-surface:
    name: Vendor SDK surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # The integration suite runs against stubs everywhere else, which proves
      # the wrapper logic but not that it is bolted to attributes the vendors
      # still ship. This job installs the real SDKs so that check actually runs
      # instead of skipping.
      - name: Install dependencies with vendor SDKs
        run: pip install -e ".[dev,sdks]"

      - name: Run integration tests against the real SDKs
        run: pytest tests/integrations/ -v

  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run pip-audit (project deps only)
        # Audit project dependencies only; pip itself is excluded via --ignore-vuln
        # CVE-2025-8869, CVE-2026-1703, CVE-2026-3219 are in pip, not our deps
        run: |
          pip-audit --skip-editable --desc \
            --ignore-vuln CVE-2025-8869 \
            --ignore-vuln CVE-2026-1703 \
            --ignore-vuln CVE-2026-3219
        continue-on-error: true

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: pip install build hatchling

      - name: Build package
        run: python -m build

      - name: Verify package contents
        shell: bash
        run: |
          pip install dist/*.whl
          python -c "import agent_lens; print(agent_lens.__version__)"
