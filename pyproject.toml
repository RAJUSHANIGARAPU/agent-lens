[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentlens-tracer"
version = "0.3.0"
description = "The interactive debugger for LLM agents. Pause, inspect, and fork any agent mid-run."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Raju S", email = "rajub4u927@gmail.com" }
]
keywords = ["llm", "agents", "debugging", "observability", "tracing", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "aiofiles>=23.0.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "aiosqlite>=0.19.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]
# Real vendor SDKs, needed only to verify that the attributes the integrations
# patch still exist upstream (tests/integrations/test_sdk_surface.py). Kept out
# of `dev` so the default matrix stays offline and fast; installed by the
# dedicated sdk-surface CI job.
sdks = [
    "openai>=1.0.0",
    "anthropic>=0.30.0",
]

[project.scripts]
agent-lens = "agent_lens.cli:app"

[project.urls]
Homepage = "https://github.com/RAJUSHANIGARAPU/agent-lens"
Repository = "https://github.com/RAJUSHANIGARAPU/agent-lens"
Documentation = "https://github.com/RAJUSHANIGARAPU/agent-lens/tree/main/docs"
"Bug Tracker" = "https://github.com/RAJUSHANIGARAPU/agent-lens/issues"

[tool.hatch.build.targets.wheel]
packages = ["agent_lens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=agent_lens --cov-report=term-missing"

[tool.coverage.run]
source = ["agent_lens"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N806"]  # Uppercase constants in tests are fine (N_AGENTS, N, etc.)
